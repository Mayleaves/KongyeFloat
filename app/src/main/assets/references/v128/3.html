<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>空叶 · 极简 Bento 快捷菜单 (5款「打开空叶」专属图标实时切换)</title>
  <style>
    :root {
      --bg-canvas: #DDE6D9;
      --bg-phone: #F4F7F0;
      --sheet-bg: #FFFFFF;
      --bento-zone: #EEF3EA;
      --tile-bg: #E5EDE0;
      --tile-hover: #D8E5D0;
      --forest-dark: #21372A;
      --forest-mid: #28664B;
      --text-main: #1C2820;
      --text-sub: #687A6D;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-canvas);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      color: var(--text-main);
    }

    /* 顶部预览小开关 */
    .preview-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: #fff;
      padding: 5px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(28, 40, 32, 0.07);
      margin-bottom: 10px;
    }

    .sw-btn {
      border: 0;
      background: transparent;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sw-btn.active {
      background: var(--forest-dark);
      color: #F4F7F0;
    }

    /* 新增：「打开空叶」5款图标选择器 */
    .icon-picker-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
      border: 1px solid rgba(40, 102, 75, 0.12);
    }

    .picker-label {
      font-size: 11.5px;
      font-weight: 750;
      color: var(--forest-dark);
      margin-right: 4px;
    }

    .icon-opt-btn {
      border: 1.5px solid transparent;
      background: var(--tile-bg);
      color: var(--forest-dark);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 650;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-opt-btn svg {
      width: 16px;
      height: 16px;
    }

    .icon-opt-btn:hover {
      background: var(--tile-hover);
    }

    .icon-opt-btn.selected {
      background: #FFFFFF;
      border-color: var(--forest-mid);
      color: var(--forest-mid);
      box-shadow: 0 3px 10px rgba(40, 102, 75, 0.14);
    }

    /* 手机视口 */
    .phone-frame {
      width: 400px;
      height: 836px;
      max-width: 100%;
      background: var(--bg-phone);
      border-radius: 46px;
      border: 8px solid #FFFFFF;
      box-shadow: 0 28px 70px rgba(22, 38, 28, 0.16), 0 0 0 1px rgba(40, 102, 75, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 状态栏 */
    .status-bar {
      height: 40px;
      padding: 10px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      z-index: 10;
    }

    .bat-pill {
      background: #2ECC71;
      color: #fff;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 10px;
    }

    /* 底层页面 */
    .home-underlay {
      padding: 10px 18px;
      transition: filter 0.3s ease, opacity 0.3s ease;
      filter: blur(1.5px);
      opacity: 0.45;
      pointer-events: none;
    }

    .home-underlay.active-bg {
      filter: blur(0);
      opacity: 1;
      pointer-events: auto;
    }

    .home-underlay h1 {
      font-size: 22px;
      font-weight: 750;
      margin-bottom: 14px;
    }

    .under-label {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .perm-row-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .perm-chip {
      background: var(--tile-bg);
      border-radius: 14px;
      padding: 9px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 650;
      color: var(--forest-dark);
    }

    .perm-check {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--forest-mid);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 9px;
    }

    /* 右侧贴边悬浮球 */
    .floating-orb {
      position: absolute;
      right: -8px;
      top: 39%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #96AF8E;
      border: 2px solid rgba(255, 255, 255, 0.88);
      display: grid;
      place-items: center;
      color: #F4F7F0;
      cursor: pointer;
      z-index: 35;
      box-shadow: -2px 5px 14px rgba(28, 46, 35, 0.18);
      transition: right 0.25s ease, transform 0.25s ease;
    }

    .floating-orb:hover {
      right: 4px;
      transform: scale(1.06);
    }

    /* ==================== 极简 Bento 快捷菜单弹窗 ==================== */
    .quick-overlay {
      position: absolute;
      inset: 0;
      background: rgba(24, 36, 28, 0.22);
      backdrop-filter: blur(3px);
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      transition: opacity 0.28s ease;
    }

    .quick-overlay.closed {
      opacity: 0;
      pointer-events: none;
    }

    .bento-sheet {
      width: 100%;
      background: var(--sheet-bg);
      border-radius: 32px;
      padding: 18px 16px 18px;
      box-shadow: 0 22px 55px rgba(20, 35, 26, 0.18);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(0) scale(1);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quick-overlay.closed .bento-sheet {
      transform: translateY(16px) scale(0.96);
    }

    /* 极简顶栏 */
    .sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 2px;
    }

    .sheet-top h2 {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .top-icon-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 0;
      background: var(--bento-zone);
      color: var(--forest-dark);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--tile-bg);
    }

    .icon-btn.active {
      background: var(--forest-dark);
      color: #FFFFFF;
    }

    /* 管理模式下显示的轻量辅助操作条 */
    .manage-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--bento-zone);
      padding: 7px 12px;
      border-radius: 14px;
      font-size: 11.5px;
      color: var(--text-sub);
    }

    .manage-mode .manage-toolbar {
      display: flex;
    }

    .manage-quick-links {
      display: flex;
      gap: 8px;
    }

    .text-link-btn {
      border: 0;
      background: #FFFFFF;
      color: var(--forest-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
    }

    /* ==================== 空状态提示 (Empty State) ==================== */
    .empty-state-box {
      padding: 44px 20px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bento-zone);
      border-radius: 26px;
      gap: 10px;
    }

    .empty-leaf-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--tile-bg);
      color: var(--forest-mid);
      display: grid;
      place-items: center;
      margin-bottom: 4px;
    }

    .empty-leaf-circle svg {
      width: 32px;
      height: 32px;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 750;
      color: var(--text-main);
    }

    .empty-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .empty-add-btn {
      margin-top: 8px;
      border: 0;
      background: var(--forest-dark);
      color: #F4F7F0;
      font-size: 12.5px;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.18s ease;
    }

    .empty-add-btn:active {
      transform: scale(0.95);
    }

    /* ==================== Bento 区块 1：系统导航 4 胶囊 ==================== */
    .bento-nav-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--bento-zone);
      padding: 7px;
      border-radius: 22px;
    }

    .nav-capsule {
      border: 0;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 10px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--forest-dark);
      box-shadow: 0 2px 6px rgba(28, 40, 32, 0.03);
      cursor: pointer;
      position: relative;
      touch-action: none;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .nav-capsule:hover {
      background: var(--tile-bg);
    }

    /* ==================== Bento 区块 2：截图与录屏专区 ==================== */
    .bento-capture-box {
      background: var(--bento-zone);
      border-radius: 24px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-top-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .duo-wide-tile {
      border: 0;
      background: var(--tile-bg);
      border-radius: 18px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--forest-dark);
      cursor: pointer;
      position: relative;
      touch-action: none;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .duo-wide-tile:hover {
      background: var(--tile-hover);
    }

    .duo-icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.75);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .duo-wide-tile .t-label {
      font-size: 13px;
      font-weight: 700;
    }

    .capture-sub-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    /* ==================== Bento 区块 3：常规工具矩阵 ==================== */
    .bento-general-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 8px;
      padding: 2px 2px 0;
    }

    /* 通用图标单元格 */
    .tile-item {
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      touch-action: none;
      transition: transform 0.18s ease, opacity 0.2s ease;
    }

    .squircle-box {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: var(--tile-bg);
      color: var(--forest-dark);
      display: grid;
      place-items: center;
      position: relative;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    /* 切换「打开空叶」图标时的脉冲高亮提示 */
    .pulse-highlight .squircle-box {
      animation: kongyePulse 0.65s ease;
    }

    @keyframes kongyePulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(40, 102, 75, 0.5); }
      50% { transform: scale(1.16); background: #CBE0C3; box-shadow: 0 0 0 10px rgba(40, 102, 75, 0); }
      100% { transform: scale(1); }
    }

    .capture-sub-row .squircle-box {
      background: #FFFFFF;
      width: 48px;
      height: 48px;
      border-radius: 16px;
    }

    .tile-item:hover .squircle-box {
      background: var(--tile-hover);
    }

    .t-label {
      font-size: 11.5px;
      font-weight: 550;
      color: var(--text-main);
      white-space: nowrap;
      pointer-events: none;
    }

    /* 长按拖拽排序时的选中态与悬浮镜像 */
    .dragging-source {
      opacity: 0.28 !important;
      transform: scale(0.92) !important;
    }

    .drag-floating-clone {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.12);
      filter: drop-shadow(0 12px 24px rgba(22, 38, 28, 0.26));
      transition: transform 0.1s ease;
    }

    /* 原位管理模式：右上角小勾与轻摇 */
    .check-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--forest-mid);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      place-items: center;
      z-index: 3;
    }

    .manage-mode .check-dot {
      display: grid;
    }

    .manage-mode .tile-item:not(.dragging-source),
    .manage-mode .nav-capsule:not(.dragging-source),
    .manage-mode .duo-wide-tile:not(.dragging-source) {
      animation: softJiggle 0.36s ease-in-out infinite alternate;
    }

    .manage-mode .tile-item:nth-child(even):not(.dragging-source) {
      animation-direction: alternate-reverse;
    }

    .is-hidden-tool {
      opacity: 0.32;
      filter: grayscale(0.7);
    }

    .is-hidden-tool .check-dot {
      background: #92A396;
    }

    @keyframes softJiggle {
      from { transform: rotate(-1.1deg); }
      to { transform: rotate(1.1deg); }
    }

    /* 统一 1.9px 森系深绿线条 */
    svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* 底部深林绿胶囊导航栏 */
    .bottom-bar {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      height: 64px;
      background: #2C4237;
      border-radius: 999px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 10;
    }

    .nav-tab {
      border: 0;
      background: transparent;
      color: rgba(244, 247, 240, 0.72);
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tab svg {
      width: 19px;
      height: 19px;
    }

    .nav-tab.active {
      background: #E5EDE0;
      color: #1E3529;
      font-weight: 750;
    }

    /* 轻提示 */
    .mini-toast {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translate(-50%, -10px);
      background: var(--forest-dark);
      color: #F4F7F0;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 60;
      white-space: nowrap;
    }

    .mini-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

  <!-- 顶部视图与功能切换 -->
  <div class="preview-switch">
    <button class="sw-btn active" id="swBento" onclick="setView('bento')">✨ 极简 Bento</button>
    <button class="sw-btn" id="swGrid" onclick="setView('grid')">🔳 4列网格</button>
    <button class="sw-btn" id="swManage" onclick="toggleManage()">⚙️ 管理 / 排序</button>
    <button class="sw-btn" onclick="testEmptyState()">🍃 预览全空状态</button>
  </div>

  <!-- 5 款全新的「打开空叶」图标实时选择器 -->
  <div class="icon-picker-bar" id="kongyePickerBar">
    <span class="picker-label">🌿 切换「打开空叶」图标：</span>
  </div>

  <div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span>12:25</span>
      <div style="display:flex; align-items:center; gap:6px; font-size:11px;">
        <span>5G</span>
        <span class="bat-pill">73</span>
      </div>
    </div>

    <div class="mini-toast" id="miniToast">已触发</div>

    <!-- 底层背景 -->
    <div class="home-underlay" id="homeUnderlay">
      <h1>首页</h1>
      <div class="under-label">权限</div>
      <div class="perm-row-card">
        <div class="perm-chip"><span class="perm-check">✓</span><span>悬浮窗</span></div>
        <div class="perm-chip"><span class="perm-check">✓</span><span>无障碍</span></div>
        <div class="perm-chip"><span class="perm-check">✓</span><span>通知</span></div>
      </div>
      <div class="under-label">工具</div>
      <div style="height:460px; background:#fff; border-radius:26px;"></div>
    </div>

    <!-- 右侧贴边悬浮球 -->
    <div class="floating-orb" onclick="openMenu()" title="点击打开快捷菜单">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;">
        <g transform="translate(12,12) rotate(40) translate(-12,-12)">
          <path d="M 12 4.5 C 16.5 4.5 17.8 12 12 17.8 C 6.2 12 7.5 4.5 12 4.5 Z" stroke-width="1.9" />
          <path d="M 12 20.2 V 9.2" stroke-width="1.9" />
        </g>
      </svg>
    </div>

    <!-- ==================== 极简 Bento 快捷菜单弹窗 ==================== -->
    <div class="quick-overlay" id="quickOverlay" onclick="closeMenu()">
      <section class="bento-sheet" id="bentoSheet" onclick="event.stopPropagation()">

        <!-- 顶栏 -->
        <header class="sheet-top">
          <h2>快捷菜单</h2>
          <div class="top-icon-actions">
            <button class="icon-btn" id="manageIconBtn" onclick="toggleManage()" title="管理工具">
              <svg viewBox="0 0 24 24" style="width:19px;height:19px;">
                <line x1="4" y1="8" x2="20" y2="8"/>
                <line x1="8" y1="5.5" x2="8" y2="10.5"/>
                <line x1="4" y1="16" x2="20" y2="16"/>
                <line x1="16" y1="13.5" x2="16" y2="18.5"/>
              </svg>
            </button>
            <button class="icon-btn" onclick="closeMenu()" title="关闭">
              <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- 管理模式下显示的辅助操作条 -->
        <div class="manage-toolbar">
          <span>点按显隐 · 长按拖动调序</span>
          <div class="manage-quick-links">
            <button class="text-link-btn" onclick="setAllTools(false)">全不选</button>
            <button class="text-link-btn" onclick="setAllTools(true)">全选</button>
          </div>
        </div>

        <!-- 动态渲染容器 -->
        <div id="bentoContent" style="display:flex; flex-direction:column; gap:12px;"></div>

      </section>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-bar">
      <button class="nav-tab active" onclick="closeMenu()">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 L12 4 L20 11.5"/><path d="M6.5 10.2 V19.5 H17.5 V10.2"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-tab" onclick="openMenu()">
        <svg viewBox="0 0 24 24">
          <g transform="translate(12,12) rotate(40) translate(-12,-12)">
            <path d="M 12 4.5 C 16.5 4.5 17.8 12 12 17.8 C 6.2 12 7.5 4.5 12 4.5 Z" fill="currentColor" stroke="none" />
            <path d="M 12 20.2 V 9.5" stroke="#2C4237" stroke-width="2" />
          </g>
        </svg>
        <span>悬浮球</span>
      </button>
      <button class="nav-tab">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 3v2.2m0 13.6V21M3 12h2.2m13.6 0H21M5.6 5.6l1.6 1.6m9.6 9.6 1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
        </svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <script>
    /**
     * 5 款专为「打开空叶」定制的极简 SVG 图标候选方案
     */
    const KONGYE_ICON_STYLES = [
      {
        key: 'orb-leaf',
        label: '1. 空叶悬浮球(推荐)',
        svg: `
          <circle cx="12" cy="12" r="8.8" stroke-opacity="0.38" />
          <g transform="translate(12,12) rotate(40) translate(-12,-12)">
            <path d="M 12 5.2 C 16.2 5.2 17.2 12 12 17.2 C 6.8 12 7.8 5.2 12 5.2 Z" />
            <path d="M 12 19.2 V 9.5" />

        `
      },
      {
        key: 'sprout-pot',
        label: '2. 破土小盆栽',
        svg: `
          <path d="M 12 13.5 V 7" />

      {
        key: 'app-badge',
        label: '3. 窗口跃出小叶',
        svg: `
          <path d="M 13 4 H 6.5 A 2.5 2.5 0 0 0 4 6.5 V 17.5 A 2.5 2.5 0 0 0 6.5 20 H 17.5 A 2.5 2.5 0 0 0 20 17.5 V 11" />
          <g transform="translate(14.5, 9.5) rotate(40) translate(-12, -12)">
            <path d="M 12 4.5 C 16.2 4.5 17.5 11.5 12 17 C 6.5 11.5 7.8 4.5 12 4.5 Z" />
            <path d="M 12 19.5 V 9" />

        `
      },
      {
        key: 'clover-spark',
        label: '4. 空叶四叶星芒',
        svg: `
          <path d="M 12 3.5 C 14.4 6.8 14.4 9.5 12 12 C 9.6 9.5 9.6 6.8 12 3.5 Z" />
          <path d="M 12 20.5 C 14.4 17.2 14.4 14.5 12 12 C 9.6 14.5 9.6 17.2 12 20.5 Z" />
          <path d="M 3.5 12 C 6.8 9.6 9.5 9.6 12 12 C 9.5 14.4 6.8 14.4 3.5 12 Z" />
          <path d="M 20.5 12 C 17.2 9.6 14.5 9.6 12 12 C 14.5 14.4 17.2 14.4 20.5 12 Z" />
          <circle cx="19" cy="5" r="1" fill="currentColor" stroke="none" />
        `

      {
        key: 'soft-flower',
        label: '5. 圆润六瓣花环',
        svg: `
          <path d="M 12 3.5 C 13.8 3.5 14.5 5.2 16.2 5.5 C 17.8 5.8 19.3 7.3 18.8 9 C 18.3 10.6 19.5 12 18.8 13.8 C 18.2 15.5 19.3 17 17.7 18.2 C 16.2 19.3 14.5 18.5 13 19.8 C 11.5 21 9.8 20.2 8.5 19 C 7.2 17.8 5.5 18.2 4.8 16.5 C 4.1 14.8 5.3 13.2 4.8 11.5 C 4.3 9.8 5.5 7.8 7.2 7 C 8.8 6.2 10.2 3.5 12 3.5 Z" />
          <circle cx="12" cy="12" r="3" />
        `
      }
    ];

    let currentKongyeIconIdx = 0;

    const ICONS = {
      leaf: `
        <g transform="translate(12,12) rotate(40) translate(-12,-12)">
          <path d="M 12 4.2 C 16.8 4.2 18.2 12 12 18 C 5.8 12 7.2 4.2 12 4.2 Z" />
          <path d="M 12 20.5 V 9" />
        </g>
      `,
      region: `
        <path d="M 10 18 H 6 A 2.5 2.5 0 0 1 3.5 15.5 V 6.5 A 2.5 2.5 0 0 1 6 4 H 15 A 2.5 2.5 0 0 1 17.5 6.5 V 10" />
        <circle cx="14.2" cy="18.8" r="1.6" />
        <circle cx="19.2" cy="18.8" r="1.6" />
        <path d="M 15.3 17.6 L 19.5 13.2 M 18.1 17.6 L 13.9 13.2" />
      `,
      longshot: `
        <path d="M 5 8 V 5.5 A 1.5 1.5 0 0 1 6.5 4 H 17.5 A 1.5 1.5 0 0 1 19 5.5 V 8" />
        <line x1="5" y1="10.5" x2="5" y2="16.5" stroke-dasharray="2 2.2" />
        <line x1="19" y1="10.5" x2="19" y2="16.5" stroke-dasharray="2 2.2" />
        <circle cx="9.2" cy="18.8" r="1.7" />
        <circle cx="14.8" cy="18.8" r="1.7" />
        <path d="M 10.5 17.5 L 15.2 12.5 M 13.5 17.5 L 8.8 12.5" />
      `,
      record: `
        <rect x="3" y="6.5" width="12" height="11" rx="2.5" />
        <path d="M 15 10.2 L 20.2 7.2 V 16.8 L 15 13.8 Z" />
      `,
      gif: `
        <rect x="3" y="6.5" width="12" height="11" rx="2.5" />
        <path d="M 15 10.2 L 20.2 7.2 V 16.8 L 15 13.8 Z" />
        <text x="4.8" y="13.6" font-size="4.7" font-weight="800" fill="currentColor" stroke="none" letter-spacing="-0.2">GIF</text>
      `,
      scrollshot: `
        <path d="M 4 8 V 5.5 A 1.5 1.5 0 0 1 5.5 4 H 13.5 A 1.5 1.5 0 0 1 15 5.5 V 8" />
        <line x1="4" y1="10.5" x2="4" y2="16.5" stroke-dasharray="2 2" />
        <line x1="15" y1="10.5" x2="15" y2="14" stroke-dasharray="2 2" />
        <circle cx="7.2" cy="18.5" r="1.5" />
        <circle cx="11.8" cy="18.5" r="1.5" />
        <path d="M 8.3 17.3 L 12.2 13 M 10.7 17.3 L 6.8 13" />
        <path d="M 19 5 V 18.5 M 16.5 15.8 L 19 18.5 L 21.5 15.8" />
      `,
      fullscreen: `
        <path fill="currentColor" stroke="none" d="M 10 6.8 V 3 C 10 1.9 10.9 1 12 1 H 19 C 20.1 1 21 1.9 21 3 V 21 C 21 22.1 20.1 23 19 23 H 12 C 10.9 23 10 22.1 10 21 V 17.2 A 0.9 0.9 0 0 1 11.8 17.2 V 20 H 19.2 V 4 H 11.8 V 6.8 A 0.9 0.9 0 0 1 10 6.8 Z" />
        <circle cx="5.5" cy="8.5" r="2" />
        <circle cx="5.5" cy="15.5" r="2" />
        <line x1="7" y1="9.8" x2="14" y2="16.2" />
        <line x1="7" y1="14.2" x2="14" y2="7.8" />
      `,
      back: `<path d="M 14.5 6.5 L 8.5 12 L 14.5 17.5" />`,
      home: `<path d="M 4 11.5 L 12 4 L 20 11.5" /><path d="M 6.5 10.2 V 19.5 H 17.5 V 10.2" /><rect x="10.2" y="14" width="3.6" height="5.5" />`,
      recents: `
        <rect x="4.5" y="4.5" width="6" height="6" rx="1.3" />
        <rect x="13.5" y="4.5" width="6" height="6" rx="1.3" />
        <rect x="4.5" y="13.5" width="6" height="6" rx="1.3" />
        <rect x="13.5" y="13.5" width="6" height="6" rx="1.3" />
      `,
      noti: `<path d="M 18 10 A 6 6 0 0 0 6 10 C 6 15.5 4 16.5 4 17.5 H 20 C 20 16.5 18 15.5 18 10 Z" /><path d="M 10.2 20 A 2 2 0 0 0 13.8 20" />`,
      recentapp: `<circle cx="12" cy="12" r="8.5" /><path d="M 12 7.5 V 12.2 H 16" />`,
      notes: `<rect x="5.5" y="3.5" width="13" height="17" rx="2.5" /><line x1="9" y1="8.5" x2="15" y2="8.5" /><line x1="9" y1="12" x2="15" y2="12" /><line x1="9" y1="15.5" x2="13" y2="15.5" />`,
      browser: `<circle cx="12" cy="12" r="8.5" /><ellipse cx="12" cy="12" rx="3.8" ry="8.5" /><line x1="3.6" y1="12" x2="20.4" y2="12" />`,
      quickset: `
        <line x1="4" y1="7" x2="20" y2="7" /><circle cx="9" cy="7" r="1.8" fill="currentColor" />
        <line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="1.8" fill="currentColor" />
        <line x1="4" y1="17" x2="20" y2="17" /><circle cx="10" cy="17" r="1.8" fill="currentColor" />
      `,
      lock: `<rect x="5" y="10.5" width="14" height="10" rx="2.2" /><path d="M 8 10.5 V 7.2 A 4 4 0 0 1 16 7.2 V 10.5" /><circle cx="12" cy="15" r="1" fill="currentColor" /><line x1="12" y1="16" x2="12" y2="17.5" />`,
      favapp: `<polygon points="12 3.8 14.6 9.1 20.5 9.9 16.2 14.1 17.2 19.9 12 17.2 6.8 19.9 7.8 14.1 3.5 9.9 9.4 9.1 12 3.8" />`,
      launcher: `
        <circle cx="6.5" cy="6.5" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="12" cy="6.5" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="6.5" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="17.5" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="6.5" cy="17.5" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="12" cy="17.5" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="17.5" cy="17.5" r="1.5" fill="currentColor" stroke="none" />
      `,
      files: `<path d="M 3.5 17.8 V 6.8 A 1.8 1.8 0 0 1 5.3 5 H 9.2 L 11.2 7.2 H 18.7 A 1.8 1.8 0 0 1 20.5 9 V 17.8 A 1.8 1.8 0 0 1 18.7 19.6 H 5.3 A 1.8 1.8 0 0 1 3.5 17.8 Z" />`,
      kongye: KONGYE_ICON_STYLES[0].svg
    };

    const ALL_ITEMS = [
      { id: 'back', name: '返回', group: 'nav', on: true },
      { id: 'home', name: '主页', group: 'nav', on: true },
      { id: 'recents', name: '最近任务', group: 'nav', on: true },
      { id: 'noti', name: '通知栏', group: 'nav', on: true },

      { id: 'region', name: '区域截图', group: 'capture-duo', on: true },
      { id: 'longshot', name: '长截图', group: 'capture-duo', on: true },
      { id: 'fullscreen', name: '整屏截图', group: 'capture-row', on: true },
      { id: 'scrollshot', name: '滚动截图', group: 'capture-row', on: true },
      { id: 'record', name: '录屏', group: 'capture-row', on: true },
      { id: 'gif', name: '录制 GIF', group: 'capture-row', on: true },

      { id: 'recentapp', name: '最近软件', group: 'general', on: true },
      { id: 'favapp', name: '常用软件', group: 'general', on: true },
      { id: 'notes', name: '便签', group: 'general', on: true },
      { id: 'browser', name: '浏览器', group: 'general', on: true },
      { id: 'quickset', name: '快捷设置', group: 'general', on: true },
      { id: 'lock', name: '锁屏', group: 'general', on: true },
      { id: 'launcher', name: '应用启动', group: 'general', on: true },
      { id: 'files', name: '打开文件', group: 'general', on: true },
      { id: 'kongye', name: '打开空叶', group: 'general', on: true }
    ];

    let viewMode = 'bento';
    let managing = false;
    let toastTimer = null;

    // 渲染顶部 5 款「打开空叶」图标切换器
    function renderKongyePicker() {
      const bar = document.getElementById('kongyePickerBar');
      bar.innerHTML = `<span class="picker-label">🌿 切换「打开空叶」图标：</span>` +
        KONGYE_ICON_STYLES.map((style, idx) => `
          <button class="icon-opt-btn ${idx === currentKongyeIconIdx ? 'selected' : ''}" onclick="selectKongyeIcon(${idx})">
            <svg viewBox="0 0 24 24">${style.svg}</svg>
            <span>${style.label}</span>
          </button>
        `).join('');
    }

    function selectKongyeIcon(idx) {
      currentKongyeIconIdx = idx;
      ICONS.kongye = KONGYE_ICON_STYLES[idx].svg;
      // 确保「打开空叶」处于开启状态以便直接看到变化
      const kongyeItem = ALL_ITEMS.find(i => i.id === 'kongye');
      if (kongyeItem) kongyeItem.on = true;
      openMenu();
      renderKongyePicker();
      render();

      // 给菜单里的「打开空叶」加一个柔和脉冲高亮，方便一眼定位
      const targetBtn = document.querySelector('[data-id="kongye"]');
      if (targetBtn) {
        targetBtn.classList.remove('pulse-highlight');
        void targetBtn.offsetWidth;
        targetBtn.classList.add('pulse-highlight');
      }
      toast(`已换为：${KONGYE_ICON_STYLES[idx].label}`);
    }

    function toast(msg) {
      const t = document.getElementById('miniToast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function renderTile(item) {
      const cls = !item.on ? 'is-hidden-tool' : '';
      return `
        <button class="tile-item ${cls}" data-id="${item.id}">
          <div class="squircle-box">
            <span class="check-dot">${item.on ? '✓' : '+'}</span>
            <svg viewBox="0 0 24 24">${ICONS[item.id]}</svg>
          </div>
          <span class="t-label">${item.name}</span>
        </button>
      `;
    }

    function render() {
      const box = document.getElementById('bentoContent');
      const sheet = document.getElementById('bentoSheet');
      sheet.classList.toggle('manage-mode', managing);

      const visible = ALL_ITEMS.filter(i => managing || i.on);

      if (visible.length === 0) {
        box.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-leaf-circle">
              <svg viewBox="0 0 24 24">${ICONS.leaf}</svg>
            </div>
            <div class="empty-title">暂无快捷工具</div>
            <div class="empty-sub">点击下方按钮勾选常用功能，长按可自由调序</div>
            <button class="empty-add-btn" onclick="toggleManage()">+ 添加快捷工具</button>
          </div>
        `;
        return;
      }

      if (viewMode === 'grid') {
        box.innerHTML = `
          <div class="bento-general-grid">
            ${visible.map(renderTile).join('')}
          </div>
        `;
        return;
      }

      const navList = visible.filter(i => i.group === 'nav');
      const duoList = visible.filter(i => i.group === 'capture-duo');
      const capRowList = visible.filter(i => i.group === 'capture-row');
      const genList = visible.filter(i => i.group === 'general');

      let html = '';

      if (navList.length > 0) {
        html += `
          <div class="bento-nav-bar">
            ${navList.map(item => `
              <button class="nav-capsule ${!item.on ? 'is-hidden-tool' : ''}" data-id="${item.id}">
                <span class="check-dot">${item.on ? '✓' : '+'}</span>
                <svg viewBox="0 0 24 24">${ICONS[item.id]}</svg>
                <span class="t-label">${item.name}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      if (duoList.length > 0 || capRowList.length > 0) {
        html += `
          <div class="bento-capture-box">
            ${duoList.length > 0 ? `
              <div class="capture-top-duo">
                ${duoList.map(item => `
                  <button class="duo-wide-tile ${!item.on ? 'is-hidden-tool' : ''}" data-id="${item.id}">
                    <span class="check-dot">${item.on ? '✓' : '+'}</span>
                    <div class="duo-icon-circle">
                      <svg viewBox="0 0 24 24">${ICONS[item.id]}</svg>
                    </div>
                    <span class="t-label">${item.name}</span>
                  </button>
                `).join('')}
              </div>
            ` : ''}
            ${capRowList.length > 0 ? `
              <div class="capture-sub-row">
                ${capRowList.map(renderTile).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      if (genList.length > 0) {
        html += `
          <div class="bento-general-grid">
            ${genList.map(renderTile).join('')}
          </div>
        `;
      }

      box.innerHTML = html;
    }

    function handleItemTap(id) {
      const item = ALL_ITEMS.find(i => i.id === id);
      if (!item) return;
      if (managing) {
        item.on = !item.on;
        render();
      } else {
        toast(item.name);
      }
    }

    function setAllTools(state) {
      ALL_ITEMS.forEach(i => i.on = state);
      render();
      toast(state ? '已全选所有工具' : '已清空选择，点击右上角保存可看空状态');
    }

    function testEmptyState() {
      ALL_ITEMS.forEach(i => i.on = false);
      managing = false;
      document.getElementById('manageIconBtn').classList.remove('active');
      document.getElementById('swManage').classList.remove('active');
      openMenu();
      render();
      toast('已切换至：什么都没选时的「空状态」');
    }

    function setView(mode) {
      viewMode = mode;
      document.getElementById('swBento').classList.toggle('active', mode === 'bento');
      document.getElementById('swGrid').classList.toggle('active', mode === 'grid');
      openMenu();
      render();
    }

    function toggleManage() {
      managing = !managing;
      document.getElementById('manageIconBtn').classList.toggle('active', managing);
      document.getElementById('swManage').classList.toggle('active', managing);
      openMenu();
      render();
      toast(managing ? '点击显隐 · 长按拖动调序' : '已保存');
    }

    function closeMenu() {
      if (managing) toggleManage();
      document.getElementById('quickOverlay').classList.add('closed');
      document.getElementById('homeUnderlay').classList.add('active-bg');
    }

    function openMenu() {
      document.getElementById('quickOverlay').classList.remove('closed');
      document.getElementById('homeUnderlay').classList.remove('active-bg');
    }

    /**
     * ==================== 长按拖拽调整位置 ====================
     */
    const contentBox = document.getElementById('bentoContent');
    let pressTimer = null;
    let isDraggingItem = false;
    let draggedId = null;
    let dragCloneEl = null;
    let startX = 0;
    let startY = 0;

    function getPoint(e) {
      const p = e.touches ? e.touches[0] || e.changedTouches[0] : e;
      return { x: p.clientX, y: p.clientY };
    }

    contentBox.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;

      const pt = getPoint(e);
      startX = pt.x;
      startY = pt.y;
      const targetId = btn.dataset.id;

      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        startDragReorder(btn, targetId, pt.x, pt.y);
      }, 260);
    });

    window.addEventListener('pointermove', (e) => {
      const pt = getPoint(e);
      if (!isDraggingItem) {
        if (pressTimer && Math.hypot(pt.x - startX, pt.y - startY) > 8) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        return;
      }

      e.preventDefault();
      if (dragCloneEl) {
        dragCloneEl.style.left = pt.x + 'px';
        dragCloneEl.style.top = pt.y + 'px';
      }

      const elemBelow = document.elementFromPoint(pt.x, pt.y);
      const overBtn = elemBelow ? elemBelow.closest('[data-id]') : null;
      if (overBtn && overBtn.dataset.id !== draggedId) {
        swapItems(draggedId, overBtn.dataset.id);
      }
    }, { passive: false });

    function finishPointer(e) {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
        const btn = e.target.closest('[data-id]');
        if (btn && !isDraggingItem) {
          handleItemTap(btn.dataset.id);
        }
      }

      if (isDraggingItem) {
        isDraggingItem = false;
        draggedId = null;
        if (dragCloneEl) {
          dragCloneEl.remove();
          dragCloneEl = null;
        }
        render();
        toast('已调整位置');
      }
    }

    window.addEventListener('pointerup', finishPointer);
    window.addEventListener('pointercancel', finishPointer);

    function startDragReorder(btn, id, x, y) {
      pressTimer = null;
      isDraggingItem = true;
      draggedId = id;

      if (navigator.vibrate) navigator.vibrate(25);
      toast('拖动到目标位置即可调序');

      const rect = btn.getBoundingClientRect();
      dragCloneEl = btn.cloneNode(true);
      dragCloneEl.className = btn.className + ' drag-floating-clone';
      dragCloneEl.style.width = rect.width + 'px';
      dragCloneEl.style.height = rect.height + 'px';
      dragCloneEl.style.left = x + 'px';
      dragCloneEl.style.top = y + 'px';
      document.body.appendChild(dragCloneEl);

      btn.classList.add('dragging-source');
    }

    function swapItems(idA, idB) {
      const idxA = ALL_ITEMS.findIndex(i => i.id === idA);
      const idxB = ALL_ITEMS.findIndex(i => i.id === idB);
      if (idxA === -1 || idxB === -1) return;

      const groupA = ALL_ITEMS[idxA].group;
      ALL_ITEMS[idxA].group = ALL_ITEMS[idxB].group;
      ALL_ITEMS[idxB].group = groupA;

      const temp = ALL_ITEMS[idxA];
      ALL_ITEMS[idxA] = ALL_ITEMS[idxB];
      ALL_ITEMS[idxB] = temp;

      render();
      const currentSource = contentBox.querySelector(`[data-id="${draggedId}"]`);
      if (currentSource) currentSource.classList.add('dragging-source');
    }

    renderKongyePicker();
    render();
  </script>
