<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="115" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- 四宫格几何背景 -->
    <rect x="0" y="0" width="256" height="256" fill="#D5E3B8" />
    <rect x="256" y="0" width="256" height="256" fill="#294233" />
    <rect x="0" y="256" width="256" height="256" fill="#829F5B" />
    <rect x="256" y="256" width="256" height="256" fill="#DCE8C6" />

    <!-- 右下角几何弧形装饰 -->
    <path d="M 256 512 A 256 256 0 0 1 512 256 L 512 512 Z" fill="#9EC16E" />

    <!-- 左上角暖阳 -->
    <circle cx="190" cy="110" r="65" fill="#F5D042" />

    <!-- 中心偏左的悬浮半透明层 -->
    <circle cx="256" cy="256" r="135" fill="#294233" fill-opacity="0.88" />
    <circle cx="256" cy="256" r="135" fill="none" stroke="#E5EDE0" stroke-width="8" stroke-opacity="0.9" />

    <!-- 中心空心叶片 -->
    <g transform="translate(256, 256) rotate(40) translate(-256, -256)">
      <path d="M 256 165 C 315 165 335 256 256 335 C 177 256 197 165 256 165 Z" fill="none" stroke="#B5D68E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 256 360 L 256 215" fill="none" stroke="#B5D68E" stroke-width="16" stroke-linecap="round" />
    </g>
  </g>
</svg>