<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" style="cursor:pointer">
  <style>
    .s3-leaf-main { transform-origin: 30px 39px; animation: s3-leaf-dip 5.2s cubic-bezier(0.3, 0, 0.2, 1) infinite; }
    .s3-leaf-sub  { transform-origin: 30px 37px; animation: s3-sub-sway 5.2s ease-in-out infinite; }
    .s3-bfly-path { animation: s3-bfly-fly 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .s3-wing      { transform-origin: 0px 0px; animation: s3-wing-flap 0.32s ease-in-out infinite; }
    @keyframes s3-bfly-fly {
      0%       { transform: translate(12px, 8px) rotate(25deg) scale(0.4); opacity: 0; }
      18%      { transform: translate(28px, 6px) rotate(10deg) scale(0.95); opacity: 1; }
      32%, 62% { transform: translate(46px, 14px) rotate(-12deg) scale(1); opacity: 1; }
      82%      { transform: translate(56px, 3px) rotate(-35deg) scale(0.7); opacity: 0; }
      100%     { transform: translate(56px, 3px) scale(0); opacity: 0; }
    }
    @keyframes s3-wing-flap {
      0%, 100% { transform: scaleX(1) scaleY(1); }
      50%      { transform: scaleX(0.35) scaleY(1.1); }
    }
    @keyframes s3-leaf-dip {
      0%, 28%  { transform: rotate(0deg); }
      36%, 58% { transform: rotate(9deg) scaleY(0.95); }
      68%      { transform: rotate(-5deg) scaleY(1.03); }
      78%      { transform: rotate(2deg); }
      90%,100% { transform: rotate(0deg); }
    }
    @keyframes s3-sub-sway {
      0%, 30%, 100% { transform: rotate(0deg); }
      45%           { transform: rotate(-7deg); }
    }
  </style>
  <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,2; 0,-11; 0,-8; 0,1; 0,-2; 0,0"
        keyTimes="0; 0.15; 0.42; 0.6; 0.78; 0.9; 1"
        dur="0.62s" begin="click" restart="whenNotActive" calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.2 0.8 0.3 1; 0.4 0 0.6 1; 0.4 0 0.2 1; 0.2 0.8 0.3 1; 0.4 0 0.2 1"/>
    <path class="s3-leaf-sub" d="M30 37C21 35 18 26 20 19C26 20 31 28 30 37Z" fill="#88B399"/>
    <g class="s3-leaf-main">
      <path d="M30 39C30 26 37 15 47 14C48 24 41 35 30 39Z" fill="#F4F6F0" stroke="#28664B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 39L40 21" stroke="#28664B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g class="s3-bfly-path">
      <g class="s3-wing">
        <path d="M0 0 C-5 -6, -7 -1, -1 1 C-5 4, -2 6, 0 1 Z" fill="#F29F80"/>
        <path d="M0 0 C5 -6, 7 -1, 1 1 C5 4, 2 6, 0 1 Z" fill="#F6C945"/>
      </g>
    </g>
    <path d="M18 39H46M21 39L24 51C24.3 52.2 25.3 53 26.5 53H37.5C38.7 53 39.7 52.2 40 51L43 39" fill="#F4F7F2" stroke="#28664B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>