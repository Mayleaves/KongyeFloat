<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空叶悬浮球 · 轻柔风格演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#252525;color:#505e79;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.intro{max-width:1180px;margin:42px auto 28px;padding:0 25px;color:#efefe8}.intro h1{font-size:21px;font-weight:600;margin:0 0 8px;letter-spacing:2px}.intro p{font-size:13px;color:#a3aaa7;line-height:1.7;margin:0}.phones{display:flex;gap:30px;justify-content:center;align-items:start;flex-wrap:wrap;padding:0 20px 55px}.phone{width:304px;height:670px;background:#f4f4ea;border-radius:32px;overflow:hidden;box-shadow:0 16px 36px #0005;display:flex;flex-direction:column;position:relative}.status{height:37px;display:flex;justify-content:space-between;padding:15px 22px 0;font-size:9px;color:#596681}.head{padding:12px 22px 4px;display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:16px;font-weight:650}.head button{border:1px solid #c7d0cb;border-radius:50%;height:28px;width:28px;background:transparent;color:#596681;cursor:pointer}.content{flex:1;overflow-y:auto;padding:7px 19px 18px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.nav{height:58px;display:flex;justify-content:space-around;background:#f4f4ea;border-top:1px solid #e3e7dd}.nav button{border:0;background:none;color:#a2aca8;font-size:10px;width:33%;cursor:pointer}.nav button b{display:block;font-size:17px;font-weight:500;margin-bottom:2px}.nav button.active{color:#52617e;font-weight:bold}.homebar{height:11px;display:grid;place-items:center}.homebar:after{content:"";width:72px;height:3px;background:#596681;border-radius:4px}.welcome{text-align:center;padding:12px 0 8px}.welcome .sub{font-size:10px;color:#9ba7a6;margin:4px 0 0}.leafball{width:71px;height:71px;margin:5px auto 10px;display:grid;place-items:center;border-radius:50%;background:#d0dfd7}.leafball svg{width:40px;height:40px}.welcome h3{margin:0;font-size:15px;font-weight:600}.card{background:#d0dfd7;border-radius:22px;padding:16px;margin:12px 0;color:#53617b}.run{display:flex;align-items:center;justify-content:space-between}.run b{font-size:13px}.run small{font-size:10px;display:block;margin-top:5px;color:#8b9b9a}.run button{border:0;border-radius:20px;padding:8px 15px;background:#f2f5eb;color:#53617b;font-size:10px;cursor:pointer}.caption{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.caption b{font-size:12px;font-weight:650}.caption span{font-size:10px;color:#9ba7a4;cursor:pointer}.permission{border-bottom:1px solid #e5e9e1;display:flex;align-items:center;justify-content:space-between;padding:10px 2px}.permission b{display:block;font-size:11px;font-weight:600}.permission small{display:block;font-size:9px;color:#a0aaa8;margin-top:4px}.badge{border:1px solid #c5d2cc;border-radius:20px;padding:6px 10px;background:transparent;color:#63758a;font-size:9px;cursor:pointer}.badge.off{background:#d7e7ec;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tool{border:0;background:#e2eae2;border-radius:13px;color:#576681;height:61px;font-size:9px;cursor:pointer}.tool span{display:block;font-size:20px;line-height:23px;margin-bottom:3px}.hero{height:160px;border-radius:23px;background:#d0dfd7;display:flex;align-items:center;justify-content:center;flex-direction:column}.hero .leafball{width:80px;height:80px;background:#edf2e8;margin:0 0 8px}.hero small{font-size:10px;color:#8f9e9b}.colors{display:flex;justify-content:center;gap:14px;margin:15px}.color{border:0;border-radius:50%;width:22px;height:22px;background:var(--color);cursor:pointer}.color.selected{outline:1px solid #74859a;outline-offset:3px}.gradient{width:100%;border:0;border-radius:24px;background:linear-gradient(100deg,#e2eee6,#c7e1ee);padding:11px;color:#53617b;font-size:11px;cursor:pointer}.slider{margin:14px 2px}.slider label{display:flex;justify-content:space-between;font-size:11px}.slider label span{color:#9ca9a6}.slider input{width:100%;accent-color:#8398ae;height:4px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 1px;border-bottom:1px solid #e5e9e1;font-size:11px;cursor:pointer}.row span{color:#9ca9a6;font-size:10px}.listcard{background:#d0dfd7;border-radius:20px;padding:4px 14px}.listcard .row{border-color:#c2d2c9}.toggle{width:31px;height:17px;border:0;border-radius:20px;background:#9aafad;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;background:#f8f9ef;border-radius:50%;width:13px;height:13px;top:2px;right:2px}.toggle.off{background:#c5ceca}.toggle.off:after{right:16px}.screenlabel{text-align:center;color:#aeb4ae;font-size:11px;letter-spacing:2px;margin-top:14px}.back{border:0;background:none;color:#53617b;font-size:21px;cursor:pointer;padding:0 8px 0 0}.detailtitle{display:flex;align-items:center;margin:8px 0 18px}.detailtitle h3{margin:0;font-size:15px}.mock{height:200px;background:#d0dfd7;border-radius:23px;display:grid;place-items:center;text-align:center;color:#8a9c9b;font-size:11px}.mock .border{width:76%;height:68%;border:1px dashed #7893a3;border-radius:12px;display:grid;place-items:center}.toolrow{display:flex;justify-content:space-around;margin:16px 0}.toolrow button{border:0;background:#d0dfd7;border-radius:18px;color:#53617b;padding:8px 12px;font-size:10px;cursor:pointer}.notice{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#53617b;color:#fff;border-radius:20px;padding:8px 12px;font-size:10px;white-space:nowrap}textarea{border:0;background:#e3ece4;color:#53617b;border-radius:16px;padding:14px;width:100%;min-height:85px;font:inherit;font-size:11px;resize:vertical}.foot{color:#8b938e;text-align:center;font-size:12px;padding:0 20px 30px}
</style></head><body><header class="intro"><h1>空叶悬浮球 · 轻柔风格</h1><p>独立前端演示：三个画面都可以切换首页、手势和外观，点击工具可查看模拟页面。</p></header><main class="phones" id="phones"></main><div class="foot">视觉演示 · 所有状态与操作均为模拟</div><script>
const leaf=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 68C13 38 41 15 83 16 84 52 65 80 38 76 30 75 24 72 18 68Z" fill="#f4f5ec" stroke="#53617b" stroke-width="4"/><path d="M17 85C29 66 45 50 68 32" fill="none" stroke="#53617b" stroke-width="4" stroke-linecap="round"/></svg>`;
const toolData=[['▧','区域截图'],['▤','长截图'],['▣','整屏截图'],['▷','录屏'],['▹','录制 GIF'],['◷','最近应用'],['✎','便签'],['◎','浏览器']];
function home(){return `<div class="welcome"><div class="leafball">${leaf}</div><h3>你好，欢迎使用空叶</h3><p class="sub">一片小叶，随处可用</p></div><div class="card run"><div><b>● 悬浮球正在运行</b><small>轻点小叶，随时打开工具</small></div><button onclick="running(this)">暂停</button></div><div class="caption"><b>权限</b><span>你的设备访问</span></div>${[['悬浮窗','让小叶显示在其他应用上方',true],['无障碍服务','导航、截图与长截图需要',false],['通知','显示运行状态与停止入口',true]].map(([n,d,on])=>`<div class="permission"><div><b>${n}</b><small>${d}</small></div><button class="badge ${on?'':'off'}" onclick="permission(this)">${on?'✓ 已开启':'去开启'}</button></div>`).join('')}<div class="caption"><b>随手工具</b><span onclick="detail(this,'管理首页工具')">管理 ⌁</span></div><div class="grid">${toolData.map(([i,n])=>`<button class="tool" onclick="detail(this,'${n}')"><span>${i}</span>${n}</button>`).join('')}</div>`}
function gesture(){return `<div class="caption"><b>悬浮球外观</b><span>你的专属小叶</span></div><div class="hero"><div class="leafball">${leaf}</div><small>在这里预览悬浮球</small></div><div class="colors">${['#52617d','#809b91','#a3b8bd','#b7a7a7','#d4c9aa'].map((c,i)=>`<button class="color ${i===0?'selected':''}" style="--color:${c}" onclick="pickColor(this,'${c}')" aria-label="选择颜色"></button>`).join('')}</div><button class="gradient" onclick="detail(this,'自定义图片或 GIF')">＋ 自定义图片或 GIF</button><div class="caption"><b>尺寸</b><span>SIZE</span></div>${[['大小',36,150,41,' dp'],['不透明度',30,100,73,'%'],['边框距离',-100,0,0,' dp']].map(([n,min,max,v,u])=>`<div class="slider"><label><b>${n}</b><span>${v}${u}</span></label><input type="range" min="${min}" max="${max}" value="${v}" oninput="this.previousElementSibling.lastElementChild.textContent=this.value+'${u}'"></div>`).join('')}<div class="caption"><b>手势</b><span>GESTURES</span></div><div class="listcard">${[['单击','快捷菜单'],['双击','返回'],['长按','边缘快捷栏'],['上划','打开空叶软件页面'],['下划','通知栏']].map(([a,b])=>`<div class="row" onclick="detail(this,'${a}手势')"><b>${a}</b><span>${b} ›</span></div>`).join('')}</div>`}
function appearance(){return `<div class="welcome"><div class="leafball">${leaf}</div><h3>让空叶更懂你</h3><p class="sub">调整适合自己的使用方式</p></div><div class="caption"><b>行为</b><span>BEHAVIOR</span></div><div class="listcard">${['自动吸边','空闲时淡化','触感反馈','增强悬浮层'].map(n=>`<div class="row"><b>${n}</b><button class="toggle" aria-label="${n}" onclick="this.classList.toggle('off')"></button></div>`).join('')}</div><div class="caption"><b>主题</b><span>THEME</span></div><div class="listcard"><div class="row" onclick="detail(this,'深色模式')"><b>深色模式</b><span>跟随系统 ›</span></div></div><div class="caption"><b>其他</b><span>MORE</span></div><div class="listcard">${['特定应用中的悬浮球','找回悬浮球','重置悬浮球位置','检查更新','GitHub'].map(n=>`<div class="row" onclick="detail(this,'${n}')"><b>${n}</b><span>›</span></div>`).join('')}</div>`}
function render(phone,key){phone.dataset.page=key;phone.querySelector('.content').innerHTML=({home,gesture,appearance}[key])();phone.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));phone.querySelector('.content').scrollTop=0;phone.querySelector('.head h2').textContent=({home:'空叶悬浮球',gesture:'手势与外观',appearance:'设置'})[key]}
function toast(el,msg){const p=el.closest('.phone');p.querySelector('.notice')?.remove();let n=document.createElement('div');n.className='notice';n.textContent=msg;p.appendChild(n);setTimeout(()=>n.remove(),1900)}
function running(b){let on=b.textContent==='暂停';b.textContent=on?'开启':'暂停';b.parentElement.querySelector('b').textContent=on?'○ 悬浮球已暂停':'● 悬浮球正在运行';b.parentElement.querySelector('small').textContent=on?'点击开启后可随时使用':'轻点小叶，随时打开工具'}function permission(b){b.classList.toggle('off');b.textContent=b.classList.contains('off')?'去开启':'✓ 已开启';toast(b,'仅为演示，不会改变系统权限')}function pickColor(b,c){let p=b.closest('.content');p.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');p.querySelector('.hero .leafball').style.background=c}
function detail(el,name){let phone=el.closest('.phone'),content=phone.querySelector('.content');let top=`<div class="detailtitle"><button class="back" onclick="render(this.closest('.phone'),this.closest('.phone').dataset.page)">‹</button><h3>${name}</h3></div>`;let body='';
if(['区域截图','长截图','整屏截图','录屏','录制 GIF'].includes(name))body=`<div class="mock"><div class="border">选区预览<br>◌</div></div><div class="caption"><b>${name}预览</b><span>轻触查看</span></div><p style="font-size:10px;line-height:1.8;color:#99a7a5">拖动边框，选择你想要的画面。</p><div class="toolrow"><button onclick="toast(this,'演示：调整选区')">选区</button><button onclick="toast(this,'演示：设置')">设置</button><button onclick="detail(this,'${name.includes('录')?'录制结果':'截图结果'}')">查看结果</button></div>`;
else if(name==='截图结果')body=`<div class="caption"><b>文字</b><span>识别结果</span></div><textarea>一片小叶，随处可用。</textarea><div class="toolrow"><button onclick="toast(this,'演示：复制文字')">复制</button><button onclick="detail(this,'文字翻译')">翻译</button><button onclick="toast(this,'演示：分享')">分享</button></div><div class="caption"><b>图片</b><span>点击预览</span></div><div class="mock">截图画面预览</div><div class="toolrow"><button onclick="toast(this,'演示：保存')">保存</button><button onclick="toast(this,'演示：分享')">分享</button><button onclick="detail(this,'编辑图片')">编辑</button></div>`;
else if(name==='录制结果')body=`<div class="mock"><div style="font-size:30px">▷</div>录制画面预览</div><div class="toolrow"><button onclick="toast(this,'演示：保存')">保存</button><button onclick="toast(this,'演示：分享')">分享</button><button onclick="toast(this,'演示：转为 GIF')">转为 GIF</button></div>`;
else if(name==='编辑图片')body=`<div class="mock">图片编辑区域</div><div class="caption"><b>绘制工具</b><span>EDIT</span></div><div class="grid">${['裁剪','旋转','画笔','文字','画框','箭头','序号','马赛克'].map((n,i)=>`<button class="tool" onclick="toast(this,'演示：${n}')"><span>${['⌗','↻','✎','T','□','↗','①','▦'][i]}</span>${n}</button>`).join('')}</div>`;
else if(name==='文字翻译')body=`<div class="caption"><b>英语 → 中文</b><span>切换语言</span></div><textarea>Hello, little leaf.</textarea><div class="caption"><b>翻译结果</b><span>TRANSLATION</span></div><div class="card">你好，小叶子。</div><button class="gradient" onclick="toast(this,'演示：复制译文')">复制译文</button>`;
else if(name==='便签')body=`<div class="caption"><b>我的便签</b><span>NOTES</span></div><textarea placeholder="写下一点什么…"></textarea><button class="gradient" onclick="toast(this,'演示：保存便签')">保存</button>`;
else {let options=name==='深色模式'?['跟随系统','浅色模式','深色模式','定时开启']:name.endsWith('手势')?['快捷菜单','返回','打开空叶软件页面','区域截图','长截图','录屏','通知栏','指定一个软件']:name==='管理首页工具'?toolData.map(x=>x[1]):['查看与设置','更多选项'];body=`<div class="caption"><b>${name}</b><span>预览</span></div><div class="listcard">${options.map(n=>`<div class="row" onclick="toast(this,'演示：${n}')"><b>${n}</b><span>›</span></div>`).join('')}</div><p style="font-size:10px;line-height:1.7;color:#9ca9a6">此页面仅展示界面效果。</p>`}
content.innerHTML=top+body;content.scrollTop=0}
const pages=[['home','首页 / HOME'],['gesture','手势 / GESTURE'],['appearance','外观 / SETTINGS']];document.getElementById('phones').innerHTML=pages.map(([key,label],i)=>`<div><section class="phone" id="p${i}"><div class="status"><span>9:30</span><span>▮ ▰ ◼</span></div><header class="head"><h2>空叶悬浮球</h2><button onclick="detail(this,'关于空叶')">?</button></header><div class="content"></div><nav class="nav">${[['home','⌂','首页'],['gesture','↗','手势'],['appearance','◌','外观']].map(([k,icon,n])=>`<button data-key="${k}" onclick="render(this.closest('.phone'),'${k}')"><b>${icon}</b>${n}</button>`).join('')}</nav><div class="homebar"></div></section><div class="screenlabel">${label}</div></div>`).join('');pages.forEach(([key],i)=>render(document.getElementById('p'+i),key));
</script></body></html>
