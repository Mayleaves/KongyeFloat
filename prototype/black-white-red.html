t-size:18px;line-height:23px;font-weight:500}.nav button.active{color:#e44141}.nav button.active strong{position:relative}.nav button.active strong:before{content:"";position:absolute;top:-5px;left:42%;width:16%;height:2px;background:#e44141}.homebar{height:11px;background:white;display:grid;place-items:center}.homebar:after{content:"";width:85px;height:3px;background:#161616;border-radius:4px}.heading{display:flex;justify-content:space-between;align-items:center}.heading .tag{color:#e34141;font-size:9px;font-weight:700}.mini{font-size:9px;color:#999;line-height:1.6}.settingscard{margin:0 15px;background:#242526;color:white;padding:16px}.settingscard h3{margin:0 0 5px;font-size:12px;letter-spacing:1px}.settingscard p{margin:0;color:#aaa;font-size:10px}.settingrow{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px}.on{color:#dc4141;font-weight:bold}.page-label{text-align:center;color:#aaa;font-size:11px;margin-top:16px;letter-spacing:2px}.caption{max-width:1120px;margin:auto;padding:0 25px 30px;color:#888;font-size:12px}@media(max-width:700px){.showcase{gap:24px}.intro{text-align:center}}

</style></head><body><div class="intro"><b>空叶悬浮球 / 界面原型</b><p>参考图风格：黑白灰底色、红色点缀、清晰的英文式排版与紧凑卡片。三个手机均可独立操作：切换页面、查看工具、调整选项。所有内容均为前端演示。</p></div><div class="showcase" id="showcase"></div><div class="caption">这是独立的交互原型，用于确认视觉方向；不更改手机上已安装的应用。</div><script>
const leaf='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 69C14 37 42 15 83 15 84 54 66 79 38 76 30 75 24 72 18 69Z" fill="#f7f7f5"/><path d="M15 86C28 67 42 51 67 33" fill="none" stroke="#242626" stroke-width="4" stroke-linecap="round"/></svg>';
const screens=[{key:'home',label:'首页 / HOME'},{key:'gesture',label:'手势 / CONTROL'},{key:'appearance',label:'外观 / SETTINGS'}];
function home(){return `<div class="notice"><div><b>悬浮球正在运行</b><small>ACTIVE · 随时开启你的快捷操作</small></div><button class="switch" onclick="toggle(this)">暂停</button></div><div class="permissions"><div class="permission-head"><h2>权限 <span> / PERMISSIONS</span></h2><span>设备访问</span></div>${[['悬浮窗','让小叶显示在其他应用上方',true],['无障碍服务','导航、截图与长截图需要',false],['通知','显示运行状态与停止入口',true]].map(([n,d,on])=>`<div class="permission-row"><div><b>${n}</b><small>${d}</small></div><button class="permission-status ${on?'':'disabled'}" onclick="permissionDemo(this)">${on?'✓ 已开启':'去开启'}</button></div>`).join('')}</div><div class="section"><div class="titleline"><h2>常用工具 <span> / TOOLS</span></h2><span onclick="feedback('管理首页工具')" style="cursor:pointer">管理 +</span></div><div class="toolgrid">${[['▣','区域截图'],['▤','长截图'],['▣','整屏截图'],['▹','录屏'],['▧','录制 GIF'],['◷','最近应用'],['✎','便签'],['◎','浏览器']].map(([i,n])=>`<button class="tool" onclick="feedback('${n}')"><strong>${i}</strong>${n}</button>`).join('')}</div></div>`}
function gesture(){return `<div class="subhead"><h1>悬浮球 & 手势</h1><p>APPEARANCE & GESTURES / 自定义你的操作方式</p></div><div class="visual"><div class="ball">${leaf}</div></div><div class="swatches">${['#242626','#62748b','#82748e','#b78b64','#777'].map((c,i)=>`<button class="swatch ${i===0?'active':''}" style="--c:${c}" onclick="color(this,'${c}')" aria-label="选择颜色"></button>`).join('')}</div><button class="upload" onclick="feedback('自定义图片或 GIF')">＋ &nbsp; 自定义图片或 GIF</button><div class="section"><div class="titleline"><h2>尺寸 <span> / SIZE</span></h2></div>${[['大小','41 dp'],['不透明度','73%'],['边框距离','0 dp']].map(([n,v])=>`<div class="setting"><div class="meta"><b>${n}</b><span>${v}</span></div><input class="range" type="range" min="${n==='边框距离'?-100:n==='大小'?36:30}" max="${n==='边框距离'?0:n==='大小'?150:100}" value="${n==='大小'?41:n==='不透明度'?73:0}" oninput="this.previousElementSibling.lastElementChild.textContent=this.value+(this.previousElementSibling.firstElementChild.textContent==='不透明度'?'%':' dp');if(this.previousElementSibling.firstElementChild.textContent==='不透明度')this.closest('.page').querySelector('.ball').style.opacity=this.value/100;if(this.previousElementSibling.firstElementChild.textContent==='大小')this.closest('.page').querySelector('.ball').style.transform='scale('+(this.value/85)+')'"></div>`).join('')}</div><div class="section"><div class="titleline"><h2>手势 <span> / GESTURES</span></h2></div>${[['单击','快捷菜单'],['双击','返回'],['长按','边缘快捷栏'],['上划','打开空叶软件页面'],['下划','通知栏']].map(([a,b])=>`<div class="row" onclick="feedback('${a}手势')"><b>${a}</b><span>${b}　›</span></div>`).join('')}</div><div style="height:20px"></div>`}
function appearance(){return `<div class="subhead"><h1>设置</h1><p>SETTINGS / 让小叶更适合你</p></div><div class="settingscard"><div class="heading"><h3>空叶悬浮球</h3><span class="tag">● ACTIVE</span></div><p>一片小叶，随处可用。</p></div><div class="section"><div class="titleline"><h2>行为 <span> / BEHAVIOR</span></h2></div>${[['自动吸边','●'],['空闲时淡化','●'],['触感反馈','●'],['增强悬浮层','●']].map(([a,b])=>`<div class="settingrow"><b>${a}</b><span class="on" onclick="this.textContent=this.textContent==='●'?'○':'●'">${b}</span></div>`).join('')}</div><div class="section"><div class="titleline"><h2>主题 <span> / THEME</span></h2></div><div class="settingrow" onclick="feedback('深色模式')"><b>深色模式</b><span class="mini">跟随系统　›</span></div></div><div class="section"><div class="titleline"><h2>其他 <span> / MORE</span></h2></div>${['特定应用中的悬浮球','找回悬浮球','重置悬浮球位置','检查更新','GitHub'].map(a=>`<div class="settingrow" onclick="feedback('${a}')"><b>${a}</b><span class="mini">›</span></div>`).join('')}</div>`}
function render(box,key){box.dataset.current=key;box.querySelector('.page').innerHTML=({home,gesture,appearance}[key])();box.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.key===key));box.querySelector('.page').scrollTop=0}
function toast(box,text){let old=box.querySelector('.previewtoast');if(old)old.remove();let n=document.createElement('div');n.className='previewtoast';n.textContent=text;box.appendChild(n);setTimeout(()=>n.remove(),2000)}
function detailTitle(name,sub){return `<div class="detailhead"><button class="back" onclick="render(this.closest('.phone'),this.closest('.phone').dataset.current)">‹</button><div><h1>${name}</h1><p>${sub}</p></div></div>`}
function items(arr){return `<div class="mocklist">${arr.map(x=>`<button class="mockitem" onclick="toast(this.closest('.phone'),'演示：${x[0]}')"><b>${x[0]}</b><span>${x[1]||'›'}</span></button>`).join('')}</div>`}
function feedback(name){let box=event.target.closest('.phone'),page=box.querySelector('.page'),content='';
if(['区域截图','长截图','整屏截图','录屏','录制 GIF'].includes(name)){let rec=name==='录屏'||name==='录制 GIF';content=detailTitle(name,'CAPTURE / 选区与工具')+`<div class="mockstage"><div class="stagecopy">SCREEN PREVIEW<br><br>屏幕内容示意</div><div class="frame"></div><div class="mockbar"><span>⌗</span><span>◻</span><span class="center">${rec?'●':'+'}</span><span>▤</span><span>⚙</span></div></div><div class="detailbody"><h2>${rec?'录制准备':'截图预览'} <span class="mini"> / PREVIEW</span></h2><p>${rec?'选择区域、声音和画质后开始录制。这里展示录制准备界面的视觉效果。':'拖动边框调整选区。这里展示截图、识别与编辑的界面样式。'}</p><button class="ghostbtn" onclick="feedback('${rec?'录制结果':'截图结果'}')">查看${rec?'录制':'截图'}结果 →</button></div>`}
else if(name==='截图结果'){content=detailTitle(name,'CAPTURE RESULT / 结果预览')+`<div class="detailbody"><h2>文字 <span class="mini"> / TEXT</span></h2><div class="previewbox">一片小叶，随处可用。<br><strong>识别文字 · 可编辑</strong></div><div class="detailtabs"><button onclick="toast(this.closest('.phone'),'演示：复制文字')">复制</button><button onclick="feedback('文字翻译')">翻译</button><button onclick="toast(this.closest('.phone'),'演示：分享文字')">分享</button></div><h2 style="margin-top:20px">图片 <span class="mini"> / IMAGE</span></h2><div class="previewimage">SCREENSHOT PREVIEW</div><div class="detailtabs"><button onclick="toast(this.closest('.phone'),'演示：保存图片')">保存</button><button onclick="toast(this.closest('.phone'),'演示：分享图片')">分享</button><button onclick="feedback('编辑图片')">编辑</button></div></div>`}
else if(name==='录制结果'){content=detailTitle(name,'RECORDING / 录制结果')+`<div class="detailbody"><div class="previewimage" style="height:245px">▶ &nbsp; VIDEO PREVIEW</div><p>00:00 ━━━━━━━━━━━ 00:12</p><div class="detailtabs"><button onclick="toast(this.closest('.phone'),'演示：保存录制')">保存</button><button onclick="toast(this.closest('.phone'),'演示：分享录制')">分享</button><button onclick="toast(this.closest('.phone'),'演示：转为 GIF')">转为 GIF</button></div></div>`}
else if(name==='编辑图片'){content=detailTitle(name,'EDITOR / 图片编辑')+`<div class="detailbody"><div class="previewimage" style="height:290px">IMAGE EDITOR</div><p>选择工具，预览图片编辑布局。</p><div class="toolgrid">${['裁剪','旋转','画笔','文字','画框','箭头','序号','马赛克'].map((n,i)=>`<button class="tool" onclick="toast(this.closest('.phone'),'已选择：${n}')"><strong>${['⌗','↻','✎','T','□','↗','①','▦'][i]}</strong>${n}</button>`).join('')}</div><button class="ghostbtn" onclick="feedback('截图结果')">完成编辑</button></div>`}
else if(name==='文字翻译'){content=detailTitle(name,'TRANSLATE / 文字翻译')+`<div class="detailbody"><div class="detailtabs"><button>自动识别</button><button>中文</button><button>英语</button></div><div class="previewbox">一片小叶，随处可用。</div><p>翻译结果</p><div class="previewbox">A little leaf, wherever you are.</div><button class="ghostbtn" onclick="toast(this.closest('.phone'),'演示：复制译文')">复制译文</button></div>`}
else if(name.endsWith('手势')){content=detailTitle(name,'GESTURE / 选择操作')+`<div class="detailbody"><h2>选择动作</h2><p>点击下方选项查看设置效果。</p>${items([['快捷菜单','已选择'],['返回'],['打开空叶软件页面'],['区域截图'],['长截图'],['录屏'],['通知栏'],['指定一个软件']])}</div>`}
else if(name==='管理首页工具'){content=detailTitle(name,'TOOLS / 自定义首页')+`<div class="detailbody"><h2>首页工具</h2><p>选择要显示在首页的工具。</p>${['区域截图','长截图','整屏截图','录屏','录制 GIF','最近应用','常用应用','便签','浏览器'].map(n=>`<label class="mockitem"><b>${n}</b><input type="checkbox" checked style="accent-color:#df4141"></label>`).join('')}<button class="ghostbtn" onclick="render(this.closest('.phone'),'home')">完成</button></div>`}
else if(name==='深色模式'){content=detailTitle(name,'THEME / 界面主题')+`<div class="detailbody"><h2>选择主题</h2><p>选择界面的显示方式。</p>${items([['跟随系统','已选择'],['浅色模式'],['深色模式'],['定时开启']])}</div>`}
else if(name==='便签'){content=detailTitle(name,'NOTES / 随手记录')+`<div class="detailbody"><h2>我的便签</h2><textarea class="miniinput" placeholder="写下一点什么..."></textarea><button class="ghostbtn" onclick="toast(this.closest('.phone'),'演示：便签已保存')">保存</button></div>`}
else if(name==='浏览器'){content=detailTitle(name,'BROWSER / 悬浮浏览')+`<div class="detailbody"><input class="miniinput" style="min-height:40px" value="https://www.bing.com"><div class="previewimage" style="height:270px">BROWSER PREVIEW</div><div class="detailtabs"><button>‹</button><button>›</button><button>↻</button><button>置顶</button><button>收起</button></div></div>`}
else {content=detailTitle(name,'KONGYE / 功能展示')+`<div class="detailbody"><h2>${name}</h2><p>这是界面效果演示，可通过底部导航继续查看其他页面。</p>${items([['查看与设置'],['更多选项']])}<button class="ghostbtn" onclick="render(this.closest('.phone'),this.closest('.phone').dataset.current)">返回</button></div>`}

function permissionDemo(b){let on=!b.classList.contains("disabled");b.classList.toggle("disabled",on);b.textContent=on?"去开启":"✓ 已开启";toast(b.closest(".phone"),"演示状态已切换，不会修改系统权限") }function toggle(b){let active=b.textContent==='暂停';b.textContent=active?'开启':'暂停';let card=b.closest('.notice');card.querySelector('b').textContent=active?'悬浮球已暂停':'悬浮球正在运行';card.querySelector('small').textContent=active?'PAUSED · 点击开启恢复悬浮球':'ACTIVE · 随时开启你的快捷操作'}function color(b,c){let panel=b.closest('.page');panel.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');panel.querySelector('.ball').style.background=c}
