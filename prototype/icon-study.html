<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>空叶 · 首页与设置图标提案</title><link rel="stylesheet" href="icon-study.css"></head><body><main class="studio"><header><span class="eyebrow">KONGYE / ICON EXPLORATION</span><h1>和小叶，一起成套。</h1><p class="intro">以原叶片的实心轮廓、柔和转角与镂空切线为共同语言，探索首页与设置图标。全部为可缩放 SVG。</p></header><section class="preview-panel"><div class="preview-copy"><span class="small-title">当前组合</span><h2 id="current-title">01 · 柔角实心</h2><p id="current-note"></p><div class="controls"><span>方案展示颜色</span><button class="color active" style="--c:#748277" data-color="#748277" aria-label="原叶片灰绿"></button><button class="color" style="--c:#287a59" data-color="#287a59" aria-label="空叶绿"></button><button class="color" style="--c:#303b34" data-color="#303b34" aria-label="深墨绿"></button><button class="color" style="--c:#667997" data-color="#667997" aria-label="雾蓝"></button></div></div><div class="preview-phone"><div class="phone-label">实际导航栏预览 <span>22 px</span></div><nav id="live-nav" aria-label="图标导航预览"></nav><div class="home-indicator"></div></div></section><section class="state-panel"><h2>选中与未选中</h2><p>选中：绿色图标与文字、浅绿色胶囊背景。未选中：灰色图标与文字、无背景。点击上方导航可切换。</p><div id="state-samples"></div></section><div class="section-heading"><h2>六组方向</h2><span>点击卡片，替换上方导航图标</span></div><section class="gallery" id="gallery"></section><section class="smalltest"><div><h2>选中组合 · 尺寸对照</h2><p>同时观察图标在小尺寸下的轮廓与镂空。</p></div><div class="size-samples" id="size-samples"></div></section><footer>叶片始终使用同一枚原款风格图标，仅更换首页与设置。选中的方向可继续细化后再用于软件。</footer></main><script src="icon-study.js"></script></body></html>
